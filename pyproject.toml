[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "housingmetrics.nyc"
version = "0.1.0"
description = "Data pipeline for housingmetrics.nyc"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dagster==1.11.5",
    "dagster-webserver==1.11.5",
    "dagster-graphql==1.11.5",
    "dagster-shared==1.11.5",
    "pandas",
    "google-cloud-bigquery",
    "shapely>=2.0",
    "pyproj",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.dagster]
python_file = "src/housingmetrics_nyc/definitions.py"
attribute = "defs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
